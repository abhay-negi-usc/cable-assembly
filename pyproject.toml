[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Install EDITABLE (`pip install -e .`, which setup-env.sh does): configs/ lives at the repo root,
# beside the package, and config.CONFIG_DIR resolves it relative to the source tree.
[project]
name = "cable-assembly"
version = "0.1.0"
description = "ROS-free BNC cable assembly on a UR10e or a KUKA iiwa 14 with a Robotiq 2F-85 and a wrist RealSense"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "py_trees>=2.2",
    "pybullet>=3.2",
]

[project.optional-dependencies]
ur = [
    "ur_rtde>=1.5.6",
    "pymodbus>=3.0,<4.0",
    "pyserial>=3.5",
]
# pyFRI is not listed: it has to be compiled against the controller's FRI version
# (FRI_CLIENT_VERSION), which an extra cannot express. setup-env.sh builds it.
iiwa = [
    "ruckig>=0.12",
    "pymodbus>=3.0,<4.0",
    "pyserial>=3.5",
]
perception = [
    "opencv-python-headless>=4.7",
    "pillow>=9.0",
    "pyrealsense2>=2.54",
    "matplotlib>=3.5",
]
# torch comes from the cu128 index and sam3 from a pinned git commit: see requirements/sam3.txt.
dev = [
    "pytest>=7.0",
    "pyflakes>=3.0",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["cable_assembly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: runs the real SAM3 model -- needs CUDA and the cached weights, skipped otherwise",
]
# A sourced ROS Humble workspace registers these pytest11 plugins (python3.10 builds). The env's
# activation hook already hides PYTHONPATH; this keeps a direct `python -m pytest` safe as well.
addopts = "-p no:launch_testing -p no:launch_pytest -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"
