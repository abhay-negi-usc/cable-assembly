# Conda layer of the cable_assembly env. Use ./setup-env.sh, which creates this env and then
# installs requirements/ with pip itself.
#
# The pip packages are deliberately NOT in a `pip:` section here: conda runs that section as
# `pip install -U -r ...`, and the -U replaces the conda-forge pybullet below with a from-source
# PyPI build and lifts every floor to the newest release -- which is how torch once arrived as a
# CUDA 13 build this driver cannot run.
#
# Python 3.12: ur_rtde and pyrealsense2 ship wheels only through cp312. The conda packages are the
# ones pip would otherwise compile (pybullet) or that a pip build must not get wrong (cmake < 4 for
# pyFRI's bundled pybind11).
name: cable
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26,<2
  - pybullet
  - cmake>=3.22,<4
  - ninja
  - pip
