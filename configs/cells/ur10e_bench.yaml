# THE UR10e BENCH -- the robot, the tool on it, and the fixtures around it.
#
# A cell is overlaid on the task config that names it (`cell: ur10e_bench`, or `--cell`), key by
# key, the cell winning -- see cable_assembly/config.py. It holds the FACTS of this bench: which arm,
# how to reach it, the tool and its calibrations, the bench height, the frames file (tool frames,
# the recorded socket target, the fixture's marker rig), and every pose written in JOINTS, since
# joint space means nothing on another robot. The task config holds none of these.
#
# Units as everywhere in configs/: mm and deg, the unit in the key name.

calibrated: true

robot:
  type: ur10e                    # the arm model -> cable_assembly/robot/kinematics/ur10e.py
  ip: 192.168.125.2
  dry_run: false                 # --dry-run simulates this arm instead (backends/sim.py)
  # Tool payload (gripper + coupler + camera): mass + CoG in the tool0 frame. REQUIRED so
  # getActualTCPForce() subtracts the tool weight and reports true EXTERNAL force.
  payload:
    mass_kg: 1.3
    cog_mm: [-26.0, 28.0, 30.0]

# ---- The tool: Robotiq 2F-85 + RealSense D405 ----------------------------------------------------
camera:
  serial_no: "218622272137"
  width: 1280
  height: 720
  fps: 15                          # D405 max at 1280x720 is 15 fps

hand_eye:                          # tool0 -> camera color optical frame
  xyz_mm: [-9.0, -80.0, 31.0]      # accounting for plate deformation
  rpy_deg: [0.0, 0.0, 0.0]

grasp_tcp_offset:
  xyz_mm: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]
fingertip_grasp:
  xyz_mm: [0.0, 0.0, 182.0]
  rpy_deg: [179.9998479605, 0.0, -90.0002104591]

# ---- The bench ------------------------------------------------------------------------------------
ground_plane:
  z_mm: -760.0                     # the work surface, in base_link

# Tool frames, the recorded mate targets and the fixture's marker rig (resolved beside the task
# config). The UR bench uses the shared catalogue.
frames_file: frames.yaml

# ---- Poses in joint space (UR10e joint order: base, shoulder, elbow, wrist 1-3) --------------------
# THE PICK POSE -- see pick_joints_deg in the task config for what it is used for.
pick_joints_deg: [-75, -155, -100, -190, -90, 195]

reset:
  # HOME = the MARKER VIEW pose (see reset: in the task config).
  home_joints_deg: [-90, -140, -130, -90, -90, 180]

pickup:
  approach_seed_joints_deg: null   # null = seed the grasp IK from wherever the arm is
  approach_via_joints_deg: null    # null = no reroute; a dipping arc is simply refused
  collision:
    joint_limits_deg: {}           # e.g. {wrist_3_joint: [-180.0, 180.0]}

assembly:
  visual_target:
    view_joints_deg: null          # null = sweep the markers from home
