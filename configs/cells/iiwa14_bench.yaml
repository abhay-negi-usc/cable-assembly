# THE iiwa 14 BENCH -- KUKA LBR iiwa 14 R820 with a Robotiq 2F-85 + RealSense D435i on the lab's flange mount
# (since 2026-11-13; before it the D405 on its own mount 2026-11-12..13, the D405 on this mount 2026-11-10..12,
# the D415 on it until 2026-11-10), and its OWN BNC socket fixture. Same lab as the UR10e, different bench.
#
# A cell is overlaid on the task config that names it (`--cell iiwa14_bench`), key by key, the cell
# winning -- see cable_assembly/config.py and configs/cells/ur10e_bench.yaml for the layout.
#
# STATUS 2026-10-29: PARTLY CALIBRATED. The ROBOT facts below are real (model, joint conventions,
# backend), and so are the hand-eye, the fingertip, the bench height and the pick / home poses
# (2026-10-29) -- everything the pickup test needs. Still missing: the frames file has no socket
# target or marker rig at all, so bnc_assembly itself refuses. A DRY RUN plans with them; a hardware run of an app that
# needs one refuses to start -- a placeholder that moved a real arm would be indistinguishable
# from a measurement.
#
# `calibrated:` says what HAS been measured: false (nothing), true (everything), or a list of the
# items done so far (robot/robot.py CALIBRATION_ITEMS). Each app needs some: the pickup test
# (apps/bnc_pickup) hand_eye, fingertip, ground_plane, poses; the BNC run all five. List an item
# only once every PLACEHOLDER line it covers is a measured value:
#   hand_eye      hand_eye below + `camera` in the frames file   (apps/hand_eye_calibration)
#   fingertip     fingertip_grasp + `fingertip` in the frames file
#   ground_plane  ground_plane.z_mm      (hand_eye_calibration prints it from the markers)
#   poses         pick_joints_deg, reset.home_joints_deg          (jog on the pendant, T1)
#   target        the frames file's targets / marker_rigs / bnc_connector_finger_holder,
#                 assembly.visual_target.view_joints_deg

calibrated: [hand_eye, fingertip, ground_plane, poses, target]

robot:
  # TRIAL DATA (the user, 2026-11-04: "record trial data for debugging on the next run" -- the pickup's
  # sudden pitch into the bench): run.log (the console, ms timestamps) and motion.csv (measured and
  # commanded joints, flange, pad tips' height over the bench, wrench, external torques, the arm's last
  # line, at record_trial_hz) in the run's experiment folder (robot/trial_recorder.py).
  record_trial: true
  record_trial_hz: 100.0
  # THE COLLISION WORLD every plain move is checked against (robot/world.py): every depth frame the
  # task captures -- the live view's camera layer's frames -- REMEMBERED across runs as the splat is
  # (data/world/world_scene.npz), and on its first start built from every view set saved on disk. On
  # after a reconfigure (2026-11-02) hit the sockets' structure the splat already showed: plain moves
  # were checked against the base plane only. `reset: true` starts it empty.
  world:
    enabled: true
    # NO PRIOR (the user, 2026-11-03): a run starts with only the robot and its base plane -- nothing
    # from earlier runs (the saved world, the saved view sets). What THIS run's camera sees is added.
    # true: start from data/world/world_scene.npz and every view set saved since (robot/world.py).
    prior: false
    overlay: false               # true: the live view draws the world as red voxels (collision_world)
  # SINGULARITIES (robot/arm.py, kinematics/iiwa14.py): A2 = 0 (shoulder), A4 = 0 (arm straight) and
  # A6 = 0 (wrist), where a small tool motion whips the joints either side. A 2026-11-03 run's bayonet
  # sweep, the arm angle held, took A6 to -3 deg (A5, A7 counter-spinning). The arm angle now steers
  # A2 and A6 off zero on every Cartesian path, and joint moves end at the cheapest solution over it.
  singularity:
    soft_deg: 15.0               # move_l / servo_l turn the arm angle to keep |A2|, |A6| above this (0: off)
    hard_deg: 3.0                # a line or servo setpoint going nearer than this (and than its start): refused / held
    psi_rate_deg_s: 30.0         # servo_l: the most the arm angle turns per second doing so
    line_psi_step_deg: 1.0       # move_l: ... per waypoint (every 1 mm / 0.5 deg of the line)
  type: iiwa14                   # the arm model -> cable_assembly/robot/kinematics/iiwa14.py
  backend: iiwa_fri              # FRI 1.15 via pyFRI (robot/backends/iiwa_fri.py); --dry-run simulates
  dry_run: false
  base_plane_z_mm: 0.0           # the plane the base stands on, base_link z: ALWAYS an obstacle to cuMotion
  # EVERY PLAIN MOVE TOO (robot/planner.py PathCheck), before the arm moves: a move_j whose straight
  # joint line dips toward that plane goes round it (a cuMotion plan); a move_l that does is refused.
  # On 2026-10-31 the reset's move home -- a straight joint line from the engage pose -- drove the
  # gripper into the bench at ~300 N. A path may go no nearer the plane than its ends do (a pick
  # puts the fingertips on the bench: cuMotion's spheres up to 16 mm into it on the real picks),
  # less tol_mm; margin_mm caps what "near" means for ends that are both well clear, and an END
  # counts no deeper than max_into_mm, so a goal through the bench is refused too.
  move_check: {enabled: true, margin_mm: 10.0, tol_mm: 5.0, max_into_mm: 25.0}
  # FRI. First contact: python -m cable_assembly.apps.arm_bringup (checks the link, the model's
  # flange and the wrench sign before anything else moves the arm).
  fri:
    host: 192.168.10.114         # the controller's KONI address: FRI accepts only it (null = any).
                                 # This PC is 192.168.10.1 on that link; set it as the FRI app's
                                 # client IP on the smartPAD. Bring-up passed here 2026-10-28.
    port: 30200                  # the FRI app's port on the smartPAD
    connect_timeout_s: 60.0      # time to start the FRI app on the pendant after launching
    # KEPT OPEN BETWEEN RUNS (the user, 2026-11-11): on Ctrl+C or any exit the run brakes the arm to rest and
    # lets go; the FRI driver HOLDS it with the session open, and the next run attaches -- no restart on the
    # pendant. Different driver options (limits, cpu, ...) end it and start anew. Unowned this long, it ends
    # by itself. End it by hand: python -m cable_assembly.robot.backends.fri_driver end --port 30200
    keep_alive: true
    keep_alive_max_s: 3600.0
    rt_priority: 80              # SCHED_FIFO for the FRI loop, if this user's rtprio allows it
    cpu: 19                      # a core to itself (2026-11-06: the link dropped twice as the 6D models loaded):
                                 # the task and all it starts keep off it. null = no reservation
    max_velocity_fraction: 0.5   # every joint stays under this fraction of its rated speed
    joint_limit_margin_deg: 2.0  # targets stay this far inside the mechanical limits
    accel_ramp_s: 0.1            # jerk: time for a move to reach its full acceleration
    stream_accel_rad_s2: 4.0     # servo / move_l: how hard the driver may catch up a setpoint
    stream_accel_ramp_s: 0.02
    stream_rate_hz: 125.0        # move_l streams its line at this rate
    line_lookahead_s: 0.1        # ... each setpoint this far ahead of when it is due, so a hiccup in
                                 # the task shorter than this cannot stall the line (0 = as sent:
                                 # a 60 ms stall swung a 25 mm/s line between 0.2 and 70 mm/s)
    line_ramp_s: 0.25            # a line's speed ramps up and down over at least this (half cosine)
    stop_accel_rad_s2: 4.0       # a guard trip / stop() brakes this hard
    stop_accel_ramp_s: 0.05
    torque_filter_hz: 10.0       # low-pass on KUKA's external joint torques (0 = off)
    wrench_damping: 0.005        # damping of the pinv(J^T) fit (~3 mN at the bench poses)
    # The tool's weight. KUKA's estimate removes it ONLY if the FRI app carries the tool's load
    # data (arm_bringup prints the untared force: ~12 N = it does not, 2026-10-29). A base-frame
    # tare cancels the weight's FORCE at every orientation, but not its MOMENT about the flange,
    # which turns with the tool; this subtracts both, with robot.payload. FALSE if the load data
    # is ever entered in Sunrise instead -- both would subtract the weight twice.
    # 2026-11-12: LBRServer attaches the D405-mount tool (1.492 kg, CoG 0.8/1.7/20.3 mm -- payload below).
    # 2026-11-13: the lab's mount + D435i again -- LBRServer's tool must go back to 1.264 kg (payload below).
    # 2026-11-06: it IS now -- LBRServer attaches the BNC tool (1.264 kg, CoG -3.5/-6.4/39.8 mm), and the run at
    # 11:22 read ~1 N at rest before any tare (was ~12 N). Back to true only with an LBRServer that attaches none.
    compensate_payload: false
    # THE KUKA'S OWN CARTESIAN IMPEDANCE, for the impedance version of the app
    # (python -m cable_assembly.apps.bnc_assembly_impedance; robot.compliance_controller kuka_impedance):
    # the stiffness the FRI app on the pendant runs its CARTESIAN_IMPEDANCE_CONTROL at. FRI cannot read it, so
    # it MUST BE WRITTEN HERE TO MATCH -- the app sizes its pushes and pulls by it. This robot's LBRServer.java
    # (read from its project 2026-11-06): CartDOF.TRANSL 3000 N/m, CartDOF.ROT 50 Nm/rad, damping 0.7 -- not
    # KUKA's defaults (2000 / 200). That version also requires the tool's load data in Sunrise (refused at
    # connect without it) and then ignores compensate_payload above.
    cartesian_impedance:
      stiffness: [3000.0, 3000.0, 3000.0, 50.0, 50.0, 50.0]   # x y z N/m, a b c Nm/rad
  payload:                       # the Robotiq + camera + coupler + plate, in the flange frame
    # Measured with the D415 on it. Kept for the D405 that took its place (2026-11-10): about the same
    # mass (the user), so not re-measured; apps/payload_calibration if the tare ever reads off.
    # apps/payload_calibration 2026-10-29 (data/experiments/payload_calibration_20261029_150521,
    # refit 151943): 25 readings over 86 deg of tilt, 0.129 Nm RMS. The mass is the A2-A4 torque
    # level (+-0.014 kg; the untared force says 1.263, the parts ~1.27); the CoG +-2 mm across,
    # +-4 mm along the tool axis, which moves 1.3 mm per 10 g of mass error.
    # 2026-11-12, THE D405 MOUNT: apps/payload_calibration (data/experiments/payload_calibration_20261112_203816,
    # 25 readings, 0.123 Nm RMS) read what Sunrise's old load data left: +0.228 kg at [24.8, 46.3, -88.1] mm. Gravity
    # torques are linear in m and m*c, so the tool is the old load plus that -- entered in LBRServer's load data
    # (the user, 2026-11-12) and here. Was 1.264 kg at [-3.5, -6.4, 39.8] (the old mount).
    # 2026-11-13, THE LAB'S MOUNT AGAIN, with the D435i (72 g, as the D415's 72 g): back to the old mount's
    # measured 1.264 kg (the 2026-10-29 fit, above). NOT re-measured -- apps/payload_calibration to confirm, and
    # LBRServer's load data in Sunrise must say the same (it was set to the D405 mount's 1.492 kg on 2026-11-12).
    # The D405 mount's: 1.492 kg at [0.8, 1.7, 20.3] mm.
    mass_kg: 1.264
    cog_mm: [-3.5, -6.4, 39.8]

# The joints, the gripper and the phase streamed to the Isaac Sim live model, ~120 times a second
# (robot/live_view.py): `cd sim && ./run.sh python scripts/live_view_gl.py` shows this arm as it
# moves. It only reads state already in memory, and with no viewer listening the packets are dropped.
live_view:
  enabled: true
  host: 127.0.0.1                # the viewer's PC (another machine: its address, and --bind there)
  port: 6008
  rate_hz: 120                   # the pose drawn is ~5 ms old (60 Hz: ~9 ms); the viewer's panel says
  frames: true                   # and every frame the camera captures, for the viewer's camera layer
  frames_port: 6009              # (TCP; needs camera.enable_depth)

# ---- The tool: Robotiq 2F-85 + RealSense D435i ----------------------------------------------------
# THE D435i (2026-11-13) on the lab's flange mount (realsense_flangemount.stl, robot/tool_geometry.py) -- the
# mount the D415 was on: its bottom on the bracket's seat, its single 1/4-20 screw through the bracket's hole,
# standing the way the D415 stood (the gripper at the BOTTOM of the image). Its colour imager is its own sensor
# (rolling shutter), 15 mm beside the left IR imager depth comes from; depth is aligned to it.
# USB 3 ONLY, as the D405 before it (bus 2 port 6, USB 3.2, streams; USB 2 offers its slow modes only --
# perception/camera.py falls back and says so).
camera:
  serial_no: '317422075514'      # the D435i on this PC's USB (firmware 5.16.0.1, 2026-11-13)
  width: 1280
  height: 720
  fps: 15
  # Depth aligned to the color image (live_view.frames, the scene, the 6D estimator), from the D435i's
  # 848x480 depth mode: Intel's best for its depth (D400 tuning guide), measuring from ~0.2 m -- NOT the D405's
  # ~7 cm. At 1280x720 its nearest reading is ~0.28 m.
  depth_width: 848
  depth_height: 480
  enable_depth: true
  # THE NEAREST IT RANGES (the user, 2026-11-13: "use RGBD where possible and RGB when depth is not feasible"):
  # every 6D estimate whose part is nearer the camera than this is made from colour alone (perception/pose6d.py
  # Pose6DService.depth_feasible). The D435i's minimum at 848x480 is ~195 mm (Intel's datasheet): the lying plug
  # (~0.3 m), the socket (0.25-0.36 m) keep depth; the plug in the hand (~0.17 m from it) goes RGB.
  depth_min_mm: 200.0

# THE D405 BEFORE IT (2026-11-10..13), for the record:
# camera:
#   serial_no: '128422270311'      # the D405 on this PC's USB (firmware 5.17.0.10, 2026-11-10)
#   width: 1280
#   height: 720
#   # 1280x720 colour and depth run at 5, 15 or 30 fps on USB 3 (5-15 / 5 on USB 2). A capture took 67 ms
#   # at 15 and at 30 (2026-11-10, USB 3.2: the alignment and the undistortion, not the frame rate).
#   fps: 15
#   # Depth aligned to the color image (live_view.frames, the scene, the 6D estimator), from the D405's
#   # 1280x720 depth mode: its best, measuring from ~7 cm (the D415 needed 848x480 and 0.3 m).
#   depth_width: 1280
#   depth_height: 720
#   enable_depth: true

hand_eye:                        # tool0 -> D435i color optical frame, the camera on tool -X.
  # NOT YET MEASURED (2026-11-13) -- a PRIOR to run apps/hand_eye_calibration from (python -m
  # cable_assembly.apps.hand_eye_calibration --cell iiwa14_bench), then replace these with what it solves.
  # THE PRIOR: the D415's MEASURED hand-eye on this same mount (below) moved to the D435i's optics about the
  # bracket's one 1/4-20 screw (robot/tool_geometry.py T_D415_CAMERA, [2.5, -2.5, 7.6] mm in the D415's optical
  # frame: Intel's _d435.urdf.xacro puts the D435i's colour origin 32.5 mm left of, 12.5 mm over and 10.6 mm in
  # front of its screw). The same carry-over gave the D405's [-78.24, -26.07, 27.78] on this mount (2026-11-10).
  # It keeps what the D415's calibration measured of how the printed bracket sits; what it cannot know is the
  # D435i's turn about the screw (one screw leaves it free -- the D415's was measured, -89.35 vs the CAD's -90)
  # and its colour imager's factory offset from Intel's nominal one.
  # FROM THE CAD (robot/tool_geometry.py T_TOOL0_CAMERA_CAD): [-69.24, -2.50, 20.64] mm, rpy [-15, 0, -90] --
  # 4.95 mm / 0.99 deg from the prior, as the D415's measured hand-eye was from its CAD.
  # THE D415 ON THIS MOUNT, MEASURED 2026-10-29: xyz [-69.81, 0.04, 17.49] mm, rpy [-14.25, 0.05, -89.35] --
  # apps/hand_eye_calibration, run data/experiments/hand_eye_calibration_20261029_134551 (13 views of
  # the marker sheet, ids 36-46), re-solved with the sizes the D415's depth measured -- 42.78 mm, 41 at
  # 39.89 -- after the run's 40.25 put the camera 25 mm off along its line of sight (the one direction
  # the sweep cannot check: ~7 mm per mm of marker size). 1.04 px RMS; single-view scatter 2.3 mm
  # median. The CAD agreed to 4.9 mm / 1.0 deg, the difference mostly along the line of sight.
  # THE D405 ON ITS OWN MOUNT (2026-11-12..13), MEASURED: [-62.27, -8.30, 30.38] mm, rpy [14.278, -0.549, 89.626]
  # (data/experiments/hand_eye_calibration_20261112_200102; d405_iiwa_mount.step).
  xyz_mm: [-70.33, -2.47, 25.47]
  rpy_deg: [-14.25, 0.05, -89.35]

gripper:
  # This PC's two-port FTDI adapter: the Robotiq answers on the SECOND port (ttyUSB1 on
  # 2026-10-29; ttyUSB0 is silent). By id, so a replug that renumbers them cannot swap it. Wins
  # over configs/cables.yaml's port (config.apply_cable_profile); the counts still come from there.
  port: /dev/serial/by-id/usb-FTDI_Dual_RS232-if01-port0
  warmup_cycles: 1               # the start-up warm-up's partial cycles: one fewer than the default 2 (the user, 2026-11-03)

grasp_tcp_offset:
  xyz_mm: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]
fingertip_grasp:
  # z (the user, 2026-11-02): THE PAD TIPS, closed on the BNC plug, from this gripper's CAD -- Robotiq's
  # 2F-85 V3 with the bench's 37.8 x 22.4 x 11.6 mm pads, on the camera mount + Robotiq's C-062
  # coupling (the stack sim/scripts/build_iiwa14.py --stage bench draws, 21.1 mm to the gripper base;
  # the wrist images agreed with the old mount's 19.1). DERIVED, NOT MEASURED: touch the pad tips off a
  # surface to confirm. 2026-11-12: 182 -> 184.1 with the D405's own mount, whose shoulder holds the
  # coupling 10.0 mm off the flange (its 2.5 mm boss inside the coupling's 3.0 mm recess) where the old
  # mount's plate held it 7.94 mm off -- the gripper, and everything clamped in it, 2.06 mm further out.
  # 2026-11-13: back to 182 -- the lab's mount again (the D435i's), its 7.94 mm plate.
  # Was 190 (2026-10-29): the UR10e's 182 + the 8 mm plate, which put it ~8 mm past these pads' tips
  # (the UR's had other fingertips). Moving it moves where the pick bites (pickup.fingertip_in_connector
  # is aimed from it), not the recorded target (the finger holder's offset in the frames file was
  # changed with it, so the holder stays where it was on tool0).
  # rpy: the UR's [180, 0, -90] turned -90 deg about tool z with the camera (UR camera on tool -Y,
  # this one on -X); the jaws close along tool Y, as the hand-eye run's images show.
  xyz_mm: [0.0, 0.0, 182.0]
  rpy_deg: [180.0, 0.0, 180.0]

# ---- The bench ------------------------------------------------------------------------------------
ground_plane:
  z_mm: 6.2                      # the work surface, in the iiwa base frame: the hand-eye run's
                                 # markers (2026-10-29), 5.9-7.5 whatever their size is taken as

frames_file: cells/iiwa14_bench.frames.yaml

pickup:
  approach_seed_joints_deg: null
  approach_via_joints_deg: null
  collision:
    # The ground-collision model's links are the UR10e's, so it refuses to run on this arm
    # rather than report clearances for a robot that is not there. Off until an iiwa model
    # exists -- which means NOTHING checks the pick path against the bench here yet.
    enabled: false
    joint_limits_deg: {}
  compliance:                    # the grasp's compliant moves: see compliance: below
    force_deadband_n: 3.0
    selected_axes: [1, 1, 1, 0, 0, 0]
  # ZERO until measured on this arm (the user, 2026-11-02). The task's [5, 0, -10] mm was measured
  # on the UR10e (2026-08-25, its gripper and pitch) and is per-gripper, per-pitch. On the
  # 2026-11-02 19:36 grasp, the belief CAD projected into the wrist image sat ~1 cm off the real
  # plug with it (silhouette IoU 0.51) and close to it without it (~0.90).
  belief_offset:
    xyz_mm: [0.0, 0.0, 3.0]
    rpy_deg: [0.0, 0.0, 0.0]

# ---- How the connector and the socket are found -------------------------------------------------
# The 6D pose estimator (the user, 2026-10-30) for the CONNECTOR, from the cable view
# (pick_joints_deg), held rigidly from the grasp (pose6d.rigid_grasp). The SOCKET too, from the
# socket view and its orbit (assembly.target_source pose6d below), seeded by and checked against
# the recorded mate (the finger-holder calibration); the same views make the stand-off's collision
# scene. SAM3 is never loaded;
# --set pose_method=sam3 goes back to it.
pose_method: pose6d
pose6d:
  # THE GRIPPER'S PIXELS in the wrist view, open (perception/gripper_mask.py, learned from the saved
  # views): hidden from the 6D detector, which took the 2F-85's knuckle for the BNC plug (2026-11-03).
  # Rebuild after moving the camera or the gripper: python -m cable_assembly.perception.gripper_mask <png>
  # OFF since the D405 took the D415's place (2026-11-10): iiwa14_bench.gripper_mask.png is the D415's
  # view of the gripper, and the D405 sees it from elsewhere, wider. Rebuild it once the D405 has 20 or
  # more saved views (the rebuild reads only the newest camera's), then name the PNG here again.
  gripper_mask: null
  # ONE MORE LOOK just before the fingers close (the user, 2026-11-03): one view from the grasp pose,
  # refined from the scan's estimate with depth ignored (the plug is ~0.18 m from the camera, nearer
  # than the D415 read; the D405 reads it), replaces the estimate the in-hand pose is held from -- if it passes the gate and
  # lies within these of the scan's (skills/pose6d_pick.py Pose6DScanner.refine_before_close).
  # NOT FOUND FROM THE SCAN POSE (the user, 2026-11-04): the camera moved by each of these in the base
  # x-y plane, one after another, and the 6D estimate made again -- the first that finds the connector
  # is taken; the arm returns to the scan pose before the pick.
  retry_views:
    - {x_mm: 50.0, y_mm: 0.0}
    - {x_mm: -50.0, y_mm: 0.0}
    - {x_mm: 0.0, y_mm: 50.0}
    - {x_mm: 0.0, y_mm: -50.0}
  # CLOSER, BEFORE THE PICK (the user, 2026-11-04): the scan sees the plug from ~0.43 m near the top of
  # the image; then the camera comes distance_mm from its middle along its line of sight, the plug
  # centred, and looks again -- re-aimed from each view's estimate (servoing) until a view agrees with
  # the estimate it was aimed from to tol_mm / tol_deg, at most servo_iters looks. Farther, by 20 mm steps to max_distance_mm,
  # where the nearest is out of reach. Its estimate replaces the scan's if it passes the gate and lies
  # within max_shift of it (skills/pose6d_pick.py servo_close_view). 300 mm: the D415 still read depth
  # there; the D405 reads it from ~7 cm.
  close_view:
    enabled: true
    distance_mm: 220.0         # the D405's range (2026-11-11; was 300 for the D415's 0.3 m): the fingertips ~65 mm
    max_distance_mm: 320.0     # over the plug; farther by 20 mm steps where the nearest is out of reach (was 380)
    servo_iters: 3
    tol_mm: 3.0
    tol_deg: 3.0
    max_shift_mm: 15.0
    max_shift_deg: 20.0
  # WHEN THE 6D ESTIMATOR DOES NOT FIND THE CONNECTOR (the user, 2026-11-04): SAM3 (sam3.mode junction),
  # its cable centreline traced to the junction, the junction put on the bench plane FITTED FROM THE
  # DEPTH (RANSAC within search_mm of ground_plane.z, normal within max_tilt_deg of up, >= min_inliers
  # readings; else the calibrated plane), raised to the connector's axis. One cable in view is taken
  # without asking; more -- the tag, else the prompt (skills/ground_pick.py DepthPlaneScanner). SAM3
  # loads only on a failure (~4.4 GB GPU). free_6d: the 6D server (~4 GB) is stopped while SAM3 runs and
  # restarted after -- SAM3 did not fit beside it on 2026-11-04 (CUDA out of memory).
  # OFF (the user, 2026-11-04: "only use RAG 6D pose estimation") -- SAM3's junction was 25-40 mm off along
  # the plug, or its heading flipped, in about half the views checked. Kept for a manual switch-on.
  fallback:
    enabled: false
    free_6d: true
    plane: {search_mm: 40.0, inlier_mm: 3.0, max_tilt_deg: 10.0, min_inliers: 2000, stride: 4, auto_single: true}
  # OFF (the user, 2026-11-04): at 0.18 m, without depth, it never produced an accepted correction (the
  # 10:19 run's: 36 mm off, rejected) and cost ~3.5 s a pick.
  refine_before_close:
    enabled: false
    max_shift_mm: 10.0
    max_shift_deg: 15.0
    use_depth: false

# ---- Poses in joint space (A1..A7) ----------------------------------------------------------------
# THE PICK POSE is where the scan looks from: the CABLE VIEW (the user, 2026-10-30). tool0 at
# [470, 147, 391] mm; the camera looks 13.5 deg off straight down from 413 mm, its axis meeting
# the bench at [635, 157] mm. Its wrist is near its limits (A5 158 of 170, A7 -142 of 175), so the
# 6D orbit reaches only 2 of its 6 views -- too few: the estimate is from this view alone. The same
# flange pose with the wrist flipped, [16, 18, 4, -112, -22, 25, 38], reaches 4 (dry run).
# Before: the hand-eye run's start view [-27, 50, 66, -96, 120, -57, -123] (still home below).
# FOR THE D405'S RANGE (the user, 2026-11-11: "update the view poses for the d405 optimal range"): the same
# look, the camera 107 mm further down its own line of sight -- its axis meets the bench 300 mm away (was 407),
# where its depth noise on the bench is ~3 mm (5-6 mm at 0.4 m; it falls as the square of the distance), and
# its wider field (87 x 58 deg) still covers what the D415 saw from 0.43 m. The fingertips 126 mm over the
# bench (were 230); joint margin 9 deg (was 8). Was [16, 18, 4, -112, 158, -25, -142] (computed by IK, the
# arm angle kept; not yet driven).
pick_joints_deg: [16.7, 31.6, 2.5, -111.5, 139.2, -13.4, -123.0]

reset:
  home_joints_deg: [-27, 50, 66, -96, 120, -57, -123]   # the pick pose (the user, 2026-10-29)

assembly:
  # WHERE THE RECOVERY SETS THE CABLE DOWN (the user, 2026-11-03: "not feasible"). The task's place
  # (-250, -100 mm, yaw -45 from the target) puts the plug down at ~(555, 6) mm heading -47 deg --
  # against the way the cable lies: it springs round once released (2026-11-03 00:35: found at
  # (536, 201), heading 25), into the headings the coaxial grasp cannot reach (0-30 deg; -47 itself
  # only with 1-6 deg joint margin). Every pre-pickup estimate on record lies at 54-88 deg round
  # (560-670, 50-120) mm. So down AS IT LIES: ~(590, 70) mm, heading ~75 deg, where the coaxial
  # grasp keeps >= 10 deg of joint margin for +/-20-30 mm and 55-95 deg around it (IK, dry run).
  reorient_recovery:
    place_offsets:
      x_mm: -217.0
      y_mm: -35.0
      z_mm: 0.0
      yaw_deg: 77.0
  # THE SOCKET MEASURED BY THE 6D ESTIMATOR (the user, 2026-11-03), fused over the socket view and
  # the orbit below, and checked against the recorded mate (targets: in the frames file, the
  # finger-holder calibration). History: on 2026-10-30, from fewer views, it could not be trusted
  # (the adapter sits in a dark box, seen nearly face-on: iou 0.74-0.75, 1 of 5 views passed, the
  # axis 16 deg off the record); the 12-view fusion of 2026-11-03 repeats run to run within 1 mm /
  # 1.2 deg. --set assembly.target_source=kinematic uses the recorded mate instead.
  target_source: pose6d
  # THE STAND-OFF (2026-10-30): 50 mm short of the trajectory's start (the task's 100 put the wrist
  # nearer the shoulder than the elbow folds, with this bench's socket and the angled grasp), and
  # the move there PLANNED by cuMotion round depth views of the socket -- the mount, the camera, the
  # gripper and the held connector (+ the first 60 mm of cable) kept off what the camera saw.
  standoff:
    distance_mm: 50.0
    plan: true
    scene: orbit                 # the socket view + an orbit about the target (pose6d.orbit); `view`: one
    # Where the plan's socket views come from: auto = a scan for a pose6d target; for a kinematic one no
    # look (the user, 2026-11-02) and the plan goes round what THIS run has seen -- only online RGBD
    # observations (the user, 2026-11-03). scan | saved (an earlier run's, on purpose) | none also work.
    socket_views: auto
  # THE ROLL ABOUT THE INSERTION AXIS: a BNC plug's body turns freely (the bayonet collar is what
  # clocks), so the engage roll is chosen for reach: -135 deg keeps every joint >= 12 deg inside the
  # limits less the 2 deg margin from the stand-off through the preload (dry run, the angled grasp).
  engage_clock_deg: -135.0
  visual_target:
    # THE SOCKET VIEW (2026-10-30), where the socket is estimated from (target_source visual /
    # pose6d): the camera 0.36 m from the socket (the recorded target, frames file), aimed at it,
    # 40 deg below horizontal and 15 deg round from straight -x -- far enough for the D415's depth
    # (~0.3 m minimum; the D405's is ~7 cm). Every joint at least 6 deg inside the limits less robot.fri's 2 deg margin
    # (A4 -111.7: the first suggestion's -118.2 was refused on the arm). The 6D orbit about the
    # socket reaches 4 of its 6 views; the fingertip stays 355 mm over the bench (dry run, with the
    # margin). The user's first, [15, 35, 4, -109, 30, -36, -20], had the socket 0.25 m away.
    # CLOSER (the user, 2026-11-02): the same line of sight 320 mm from the socket (where the 6D views
    # of that evening put it), was [21.1, 19.6, 6.6, -111.7, 76.7, -37.9, -62.2] at 350 mm -- ~10%
    # more pixels on it, its nose still past the D415's 0.3 m. Least joint margin 10 deg (A4; IK +
    # check_plan, dry run). 310 mm reaches more views only with the wrist flipped (A5 -109, A7 122).
    # FOR THE D405'S RANGE (the user, 2026-11-11): the same line of sight, 250 mm from the socket (was 316) --
    # its depth noise ~40% lower, the orbit about it (at the view's distance) closer too; all 16 orbit views
    # IK-reachable (13 before), joint margin 16 deg (was 10). The fingertips 88 mm from the socket's middle
    # (were 151); 22 mm clear of the remembered world (33 before). Was [20.1, 23.2, 5.7, -109.8, 72.7, -36.9,
    # -58.9] (computed by IK, the arm angle kept; not yet driven).
    # ALL THE SOCKETS IN VIEW (the user, 2026-11-12, for the USB insertion next): further back and more square on
    # to the fixture than the BNC-only view, [18.2, 31.8, 4.3, -104.1, 65.5, -35.6, -53.0] (250 mm from the BNC
    # socket), which this replaces.
    # (the user's first for all the sockets, the same evening: [24, 27, -7, -110, 47, -17, -31])
    # 50 mm BACK ALONG THE TOOL'S Z (the user, 2026-11-13, after the cable-held USB plug: "retracted -5cm in z in
    # tool frame"), was [30, 50, -10, -116, 25, -62, 2]. Straight back the elbow folds past its limit after 13 mm
    # (A4 -118), so -- the user's choice of what the arm can do -- the same orientation 50 mm back AND 105 mm along
    # the tool's +y (~ base +y), where it unfolds: A4 -114.8 (5 deg inside the mechanical limit, 4 before). The
    # camera 297-359 mm from the four sockets (was 252-290), all in view, the USB's at pixel (599, 382) (was
    # (835, 355)). IK (ik_goal) only: not yet driven, the orbit's reach from here not checked.
    # RAISED 50 mm IN BASE z (the user, 2026-11-13), same orientation and arm angle, from
    # [32.6, 48.3, 5.2, -114.8, 40.6, -67.3, -13.3] (tool0 z 232 -> 282 mm). A4 -116.3: 3.7 deg inside the limit.
    # IK only, not yet driven.
    view_joints_deg: [32.0, 41.2, 6.0, -116.3, 42.8, -63.2, -17.6]
    # From the socket views straight on to the pick pose -- not home first (the user, 2026-11-03).
    # That move is checked against the base plane and the remembered world (robot/world.py), and
    # planned round what is in the way.
    return_home_after: false
    # ONCE A RUN (the user, 2026-11-11): the socket is looked at before the FIRST pick only -- the look that is
    # also the stand-off plan's scene -- and kept for every attempt and trial after it (the fixture does not
    # move). refine_before_standoff below still re-measures it each attempt with the connector in the hand.
    # false: looked at before every pick.
    localize_once: true
    # A SMALL SCAN FOR THE SCENE at that first look (the user, 2026-11-13: "do a small scan at initial socket view
    # to increase the range and accuracy of the scene"). The gripper is empty then, so these are the views the
    # collision world the stand-off is planned round is BUILT from (a view with the plug in the hand only clears):
    # until now the one coarse view (172 occupied voxels on 2026-11-13). skills/pose6d_pick.py scene_scan:
    #   the ring   the camera swung tilts_deg about the socket, toward `pans` directions -- parallax (~70 mm at
    #              12 deg from 0.33 m): the fixture's sides, and one view's depth errors carved by the others
    #   the looks  the camera turned look_deg about its own centre, toward `looks` directions -- a wider field
    #              (the D405's 87 x 58 deg becomes ~127 x 98): beside, above and below the fixture
    # From the view pose above 3 of the 4 ring views and all 4 looks are reachable (dry run; a view that is not is
    # left out). Not yet driven on the arm. Speed, frames, bench clearance and guard are pose6d.orbit's.
    scene_scan:
      enabled: true
      tilts_deg: [12.0]
      pans: 4
      look_deg: 20.0
      looks: 4
    # MORE VIEWS of the socket, fused (the estimator refines one pose against all of them): two rings,
    # 12 and 24 deg off the line of sight, 8 directions each -- 12 of the 16 reachable from the pose
    # above (was 1 ring x 6: 4 of 6), 5 frames' median depth each. Over pose6d.orbit, for the socket only.
    orbit:
      tilts_deg: [12.0, 24.0]
      pans: 8
      frames_per_view: 3        # was 5: 3 frames' median depth, each view checked still (pose6d.orbit)
    # TWO STAGES (the user, 2026-11-03): before the pick ONE view -- a coarse pose, to know where to
    # look; then, the connector in the hand, just before the stand-off: the view pose again and the 3
    # most spread of the 24-deg ring's reachable views -- 4 views, refined from the coarse pose (4
    # spread views agreed with the 12-view fusion to 0.8 mm / 1.3 deg on the 2026-11-03 data).
    refine_before_standoff:
      enabled: true
      orbit:
        tilts_deg: [24.0]
        pans: 8
        max_views: 3            # beyond the view pose itself: 4 views in all
        # ONE MORE, FROM BELOW, LOOKING UP (the user, 2026-11-06: "the socket estimate is biased pitched down,
        # add a view of the socket from a lower angle that looks upwards towards the socket"). Every view above
        # looks DOWN at it (the view pose 40 deg down, the ring 16-64 deg). This one: the camera swung about the
        # socket, same distance, until its line of sight rises 10 deg above horizontal -- a 50 deg change of
        # viewpoint (skills/pose6d_pick.py low_views; always kept, never thinned by max_views). Steeper is out of
        # reach of the 60 mm bench clearance from this view pose (+12 deg the most; dry run, 2026-11-06).
        low_views:
          - {elevation_deg: 10.0, azimuth_deg: 0.0}
    # LOOK PAST THE CONNECTOR IN THE HAND (the user, 2026-11-04): from the view pose the held plug
    # stood up from the image's bottom edge into the socket (its tip at v ~400 px, the socket's lower
    # edge ~410: data/pose6d/20261104_071018_*). With something held, the camera pitches about its
    # own centre until the socket's CAD (from its last estimate) is margin_px above the held CAD and
    # top_margin_px below the top edge -- then looks, and re-aims from what that view measures, up to
    # servo_iters times, until the correction is under tol_deg. The orbit keeps that framing.
    # 2026-11-12 (the user: "take into account occlusion from the gripper and held connector"): the camera turns
    # about its own centre in ANY direction across its line of sight -- the least turn within max_deg -- until
    # min_visible of the socket's CAD outline is margin_px clear of the gripper (closed, tool_geometry's view
    # envelope) and the held part's CAD, and all of it edge_px inside the image (skills/pose6d_pick.py aim_view).
    # The D405 on its own mount has the gripper at the image's TOP: the rule above (socket ABOVE the held part)
    # could never be met there. orbit: each refine/orbit view is turned the same way before it is planned.
    aim_past_held:
      enabled: true
      margin_px: 15.0
      edge_px: 30.0
      max_deg: 25.0
      min_visible: 0.95
      orbit: true
      servo_iters: 3
      tol_deg: 1.0
  # CONNECTOR CLOCKING'S COMPLIANCE (the user, 2026-11-06: "is connector clocking run under compliance
  # control? if not it should be, if it is then lower the stiffness"). It is -- admittance about the
  # connector -- but under this arm's compliance (below: translations only) its roll about the screw axis
  # was RIGID: the shared 10 Nm/rad never acted. Here x, the push, is 500 N/m (shared 1500, the UR's), and
  # rx is compliant at 5 Nm/rad over a 0.5 Nm deadband -- a roll about the plug's own axis, at the plug,
  # moves no tip (the tilts are what made the rotations rigid below); y/z/ry/rz stay force-nulled (shared
  # force_null). The push stays under success_advance_mm (5 mm): 4.5 mm -> ~5.3 N of press with the 3 N
  # deadband (was 7.5 N), ~3.9 N once dropped 2.8 mm onto the pins (was ~3.3 N).
  connector_clocking:
    stiffness: [500.0, 500.0, 500.0, 5.0, 10.0, 10.0]
    selected_axes: [1, 1, 1, 1, 0, 0]    # + rx (ry/rz stay stiff: no tilt nulling, below)
    torque_deadband_nm: 0.5              # rx: KUKA's torque estimate error is not yielded to
    push_mm: 4.5
    # NO TILT NULLING HERE (2026-11-06, the user: "the rotation angle is tilted"). Every clocking run today held
    # the tilt null at its 3 deg cap -- the plug turned 3 deg off the screw axis (median; up to 4.3 under the
    # admittance, 4-9 deg under the KUKA's 50 Nm/rad) -- driven by 2-3.5 Nm read at the mating face, which the
    # tilt never took off. The side load (y, z) is still nulled. Back to [y, z, ry, rz] to try it again.
    force_null:
      axes: [y, z]
  # LOCK AND TAKE APART (the user, 2026-11-03): after the bayonet seats, the collar turn, the tug,
  # then the disassembly (unlock, un-clock, extract, put the cable down at place_offsets above).
  # FIRST TIME ON THIS ARM: collar_offset_mm (-2, from the shared config) was set on the UR and is
  # not measured here -- where the pad tips close relative to the ring is worth watching (phase
  # gates on) on the first run. Every collar station is IK- and wall-checked before the arm moves.
  collar_clocking:
    enabled: true
    # THE RETRACT BEFORE THE GRIPPER PITCHES ONTO THE AXIS (2026-11-05 23:47: "No IK" at every grasp
    # roll). The shared 150 mm is the UR's: here it put the reorient station's wrist centre 375 mm from
    # the shoulder, nearer than the iiwa's elbow folds (A4 +-120 deg less the margin: ~405 mm), so NO
    # roll about the axis could solve -- the roll only turns A7. Replayed on that run's socket pose:
    # threading legs <= 130 mm (retract <= ~105) solve at 72-73 of 73 rolls; 90 keeps ~25 mm inside.
    retract_mm: 90.0
    # 2026-11-12: NOT "~25 mm inside" -- the station is this PLUS where the pads hold the plug (107-114 mm from the
    # collar with the pick's grasp, 120 with a plug hand-loaded further back), and over ~100 mm A4 would pass -120
    # (22:42, and 6 of 10 runs on 2026-11-06). Kept as the PREFERRED retract: when the station it gives does not
    # solve, the app shortens it to the longest that does, less reach_margin_mm, never under min_retract_mm.
    min_retract_mm: 40.0
    reach_margin_mm: 10.0
    # WHERE THE FINGERTIP CLOSES ON THE COLLAR, mm along the connector +X (into the wall) from the connector
    # frame's origin. The shared -2 is the UR's; on this arm the fingers went ~3 mm too far (the user,
    # 2026-11-06) -> 3 mm back out. The unlock (disassembly) grips at the same station.
    # 2026-11-06 again: 2 mm further back ("back up collar clocking and tug and disassembly targets by 2mm") --
    # the tug pulls on this grip and the disassembly's unlock re-grips here, so all three move together.
    collar_offset_mm: -7.0
  disassembly:
    enabled: true
    cycles: 1                    # the shared default is 10; raise once one full cycle has run
  engage:
    contact:
      # 'ARE WE TOUCHING', from KUKA's torque-based estimate: its axial error while the arm creeps
      # is ~1-2 N (and 2-5 N over larger moves), so the UR's 1.0 N declared contact with nothing
      # touched (2026-10-30). Above the error, and held twice as long.
      force_n: 3.0
      persistence_s: 0.20

# ---- Compliance on a wrench ESTIMATED from joint torques (robot/admittance.py) -------------------
# The software admittance yields to the wrench; this arm's comes from its joint torques, and while
# it moves that estimate is off by friction that flips with each joint's direction. With the UR's
# settings the two drove each other: on 2026-10-30 the contact creep swung the connector +-3.5 mm
# across its axis at 0.8 Hz and 5 mm along it with nothing touched (the grasp's compliant moves
# up to 5 mm off their lines) -- the shaking. So, for this arm: forces under 3 N are not yielded
# to (only the excess is), and the rotations are not compliant at all -- 0.5 Nm of estimate error
# at 10 Nm/rad tilted the tool 3 deg, ~10 mm at the connector's tip. The translations still give,
# so a connector off the socket's axis is still guided in.
compliance:
  force_deadband_n: 3.0
  selected_axes: [1, 1, 1, 0, 0, 0]
