# THE iiwa 14 BENCH -- KUKA LBR iiwa 14 R820 with a Robotiq 2F-85 + RealSense D415, and its OWN
# BNC socket fixture. Same lab as the UR10e, different bench.
#
# A cell is overlaid on the task config that names it (`--cell iiwa14_bench`), key by key, the cell
# winning -- see cable_assembly/config.py and configs/cells/ur10e_bench.yaml for the layout.
#
# STATUS 2026-10-29: PARTLY CALIBRATED. The ROBOT facts below are real (model, joint conventions,
# backend), and so are the hand-eye, the fingertip, the bench height and the pick / home poses
# (2026-10-29) -- everything the pickup test needs. Still missing: the frames file has no socket
# target or marker rig at all, so bnc_assembly itself refuses. A DRY RUN plans with them; a hardware run of an app that
# needs one refuses to start -- a placeholder that moved a real arm would be indistinguishable
# from a measurement.
#
# `calibrated:` says what HAS been measured: false (nothing), true (everything), or a list of the
# items done so far (robot/robot.py CALIBRATION_ITEMS). Each app needs some: the pickup test
# (apps/bnc_pickup) hand_eye, fingertip, ground_plane, poses; the BNC run all five. List an item
# only once every PLACEHOLDER line it covers is a measured value:
#   hand_eye      hand_eye below + `camera` in the frames file   (apps/hand_eye_calibration)
#   fingertip     fingertip_grasp + `fingertip` in the frames file
#   ground_plane  ground_plane.z_mm      (hand_eye_calibration prints it from the markers)
#   poses         pick_joints_deg, reset.home_joints_deg          (jog on the pendant, T1)
#   target        the frames file's targets / marker_rigs / bnc_connector_finger_holder,
#                 assembly.visual_target.view_joints_deg

calibrated: [hand_eye, fingertip, ground_plane, poses, target]

robot:
  type: iiwa14                   # the arm model -> cable_assembly/robot/kinematics/iiwa14.py
  backend: iiwa_fri              # FRI 1.15 via pyFRI (robot/backends/iiwa_fri.py); --dry-run simulates
  dry_run: false
  base_plane_z_mm: 0.0           # the plane the base stands on, base_link z: ALWAYS an obstacle to cuMotion
  # EVERY PLAIN MOVE TOO (robot/planner.py PathCheck), before the arm moves: a move_j whose straight
  # joint line dips toward that plane goes round it (a cuMotion plan); a move_l that does is refused.
  # On 2026-10-31 the reset's move home -- a straight joint line from the engage pose -- drove the
  # gripper into the bench at ~300 N. A path may go no nearer the plane than its ends do (a pick
  # puts the fingertips on the bench: cuMotion's spheres up to 16 mm into it on the real picks),
  # less tol_mm; margin_mm caps what "near" means for ends that are both well clear, and an END
  # counts no deeper than max_into_mm, so a goal through the bench is refused too.
  move_check: {enabled: true, margin_mm: 10.0, tol_mm: 5.0, max_into_mm: 25.0}
  # FRI. First contact: python -m cable_assembly.apps.arm_bringup (checks the link, the model's
  # flange and the wrench sign before anything else moves the arm).
  fri:
    host: 192.168.10.114         # the controller's KONI address: FRI accepts only it (null = any).
                                 # This PC is 192.168.10.1 on that link; set it as the FRI app's
                                 # client IP on the smartPAD. Bring-up passed here 2026-10-28.
    port: 30200                  # the FRI app's port on the smartPAD
    connect_timeout_s: 60.0      # time to start the FRI app on the pendant after launching
    rt_priority: 80              # SCHED_FIFO for the FRI loop, if this user's rtprio allows it
    max_velocity_fraction: 0.5   # every joint stays under this fraction of its rated speed
    joint_limit_margin_deg: 2.0  # targets stay this far inside the mechanical limits
    accel_ramp_s: 0.1            # jerk: time for a move to reach its full acceleration
    stream_accel_rad_s2: 4.0     # servo / move_l: how hard the driver may catch up a setpoint
    stream_accel_ramp_s: 0.02
    stream_rate_hz: 125.0        # move_l streams its line at this rate
    line_lookahead_s: 0.1        # ... each setpoint this far ahead of when it is due, so a hiccup in
                                 # the task shorter than this cannot stall the line (0 = as sent:
                                 # a 60 ms stall swung a 25 mm/s line between 0.2 and 70 mm/s)
    line_ramp_s: 0.25            # a line's speed ramps up and down over at least this (half cosine)
    stop_accel_rad_s2: 4.0       # a guard trip / stop() brakes this hard
    stop_accel_ramp_s: 0.05
    torque_filter_hz: 10.0       # low-pass on KUKA's external joint torques (0 = off)
    wrench_damping: 0.005        # damping of the pinv(J^T) fit (~3 mN at the bench poses)
    # The tool's weight. KUKA's estimate removes it ONLY if the FRI app carries the tool's load
    # data (arm_bringup prints the untared force: ~12 N = it does not, 2026-10-29). A base-frame
    # tare cancels the weight's FORCE at every orientation, but not its MOMENT about the flange,
    # which turns with the tool; this subtracts both, with robot.payload. FALSE if the load data
    # is ever entered in Sunrise instead -- both would subtract the weight twice.
    compensate_payload: true
  payload:                       # the Robotiq + D415 + coupler + plate, in the flange frame
    # apps/payload_calibration 2026-10-29 (data/experiments/payload_calibration_20261029_150521,
    # refit 151943): 25 readings over 86 deg of tilt, 0.129 Nm RMS. The mass is the A2-A4 torque
    # level (+-0.014 kg; the untared force says 1.263, the parts ~1.27); the CoG +-2 mm across,
    # +-4 mm along the tool axis, which moves 1.3 mm per 10 g of mass error.
    mass_kg: 1.264
    cog_mm: [-3.5, -6.4, 39.8]

# The joints, the gripper and the phase streamed to the Isaac Sim live model, ~120 times a second
# (robot/live_view.py): `cd sim && ./run.sh python scripts/live_view_gl.py` shows this arm as it
# moves. It only reads state already in memory, and with no viewer listening the packets are dropped.
live_view:
  enabled: true
  host: 127.0.0.1                # the viewer's PC (another machine: its address, and --bind there)
  port: 6008
  rate_hz: 120                   # the pose drawn is ~5 ms old (60 Hz: ~9 ms); the viewer's panel says
  frames: true                   # and every frame the camera captures, for the viewer's camera layer
  frames_port: 6009              # (TCP; needs camera.enable_depth)

# ---- The tool: Robotiq 2F-85 + RealSense D415 -----------------------------------------------------
camera:
  serial_no: '840412060409'      # the D415 on this PC's USB (the only RealSense found 2026-10-28)
  width: 1280
  height: 720
  fps: 30                        # the D415 runs 1280x720 at 30 fps (the D405 only 15)
  # For the live view's camera layer (live_view.frames): depth aligned to the color image, from the
  # 848x480 depth mode. capture() took 33.5 ms with it and without it (measured 2026-10-29).
  enable_depth: true

hand_eye:                        # tool0 -> D415 color optical frame, the camera on tool -X.
  # MEASURED 2026-10-29: apps/hand_eye_calibration, run data/experiments/
  # hand_eye_calibration_20261029_134551 (13 views of the marker sheet, ids 36-46), re-solved with
  # the sizes the D415's depth measured -- 42.78 mm, 41 at 39.89 -- after the run's 40.25 put the
  # camera 25 mm off along its line of sight (the one direction the sweep cannot check: ~7 mm
  # per mm of marker size). 1.04 px RMS; single-view scatter 2.3 mm median.
  # The CAD (xyz [0, -68.79, 12.65], rpy [-15, 0, 0] from the flange, turned -90 deg about tool z)
  # agrees to 4.9 mm / 1.0 deg, the difference mostly along the line of sight.
  xyz_mm: [-69.81, 0.04, 17.49]
  rpy_deg: [-14.25, 0.05, -89.35]

gripper:
  # This PC's two-port FTDI adapter: the Robotiq answers on the SECOND port (ttyUSB1 on
  # 2026-10-29; ttyUSB0 is silent). By id, so a replug that renumbers them cannot swap it. Wins
  # over configs/cables.yaml's port (config.apply_cable_profile); the counts still come from there.
  port: /dev/serial/by-id/usb-FTDI_Dual_RS232-if01-port0

grasp_tcp_offset:
  xyz_mm: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]
fingertip_grasp:                 # the UR10e's fingertip, carried over (2026-10-29)
  # z: the same 2F-85, fingers and Robotiq coupling as the UR10e (the user, 2026-10-29), whose
  # fingertip is 182 mm out, plus the 8 mm camera plate between this flange and the coupling.
  # rpy: the UR's [180, 0, -90] turned -90 deg about tool z with the camera (UR camera on tool -Y,
  # this one on -X); the jaws close along tool Y, as the hand-eye run's images show.
  xyz_mm: [0.0, 0.0, 190.0]
  rpy_deg: [180.0, 0.0, 180.0]

# ---- The bench ------------------------------------------------------------------------------------
ground_plane:
  z_mm: 6.2                      # the work surface, in the iiwa base frame: the hand-eye run's
                                 # markers (2026-10-29), 5.9-7.5 whatever their size is taken as

frames_file: cells/iiwa14_bench.frames.yaml

pickup:
  approach_seed_joints_deg: null
  approach_via_joints_deg: null
  collision:
    # The ground-collision model's links are the UR10e's, so it refuses to run on this arm
    # rather than report clearances for a robot that is not there. Off until an iiwa model
    # exists -- which means NOTHING checks the pick path against the bench here yet.
    enabled: false
    joint_limits_deg: {}
  compliance:                    # the grasp's compliant moves: see compliance: below
    force_deadband_n: 3.0
    selected_axes: [1, 1, 1, 0, 0, 0]
  # ZERO until measured on this arm (the user, 2026-11-02). The task's [5, 0, -10] mm was measured
  # on the UR10e (2026-08-25, its gripper and pitch) and is per-gripper, per-pitch. On the
  # 2026-11-02 19:36 grasp, the belief CAD projected into the wrist image sat ~1 cm off the real
  # plug with it (silhouette IoU 0.51) and close to it without it (~0.90).
  belief_offset:
    xyz_mm: [0.0, 0.0, 0.0]
    rpy_deg: [0.0, 0.0, 0.0]

# The in-hand belief refined from the wrist image after the lift (bnc_assembly.yaml in_hand_rgb):
# on the 2026-11-02 grasp it fitted at IoU 0.955, +1.0 mm / -1.5 deg from the zero-offset belief.
in_hand_rgb:
  enabled: true

# ---- How the connector and the socket are found -------------------------------------------------
# The 6D pose estimator (the user, 2026-10-30) for the CONNECTOR, from the cable view
# (pick_joints_deg), held rigidly from the grasp (pose6d.rigid_grasp). The SOCKET is the recorded
# mate (assembly.target_source kinematic below, the finger-holder calibration), not estimated; the
# socket view is only looked from for the stand-off's collision scene. SAM3 is never loaded;
# --set pose_method=sam3 goes back to it.
pose_method: pose6d

# ---- Poses in joint space (A1..A7) ----------------------------------------------------------------
# THE PICK POSE is where the scan looks from: the CABLE VIEW (the user, 2026-10-30). tool0 at
# [470, 147, 391] mm; the camera looks 13.5 deg off straight down from 413 mm, its axis meeting
# the bench at [635, 157] mm. Its wrist is near its limits (A5 158 of 170, A7 -142 of 175), so the
# 6D orbit reaches only 2 of its 6 views -- too few: the estimate is from this view alone. The same
# flange pose with the wrist flipped, [16, 18, 4, -112, -22, 25, 38], reaches 4 (dry run).
# Before: the hand-eye run's start view [-27, 50, 66, -96, 120, -57, -123] (still home below).
pick_joints_deg: [16, 18, 4, -112, 158, -25, -142]

reset:
  home_joints_deg: [-27, 50, 66, -96, 120, -57, -123]   # the pick pose (the user, 2026-10-29)

assembly:
  # THE SOCKET FROM THE RECORDED MATE (targets: in the frames file, the finger-holder calibration),
  # the connector from the 6D estimator. The 6D socket estimate cannot be trusted on this fixture
  # (2026-10-30): the adapter sits in a dark mounting box, seen nearly face-on, so the CAD matches
  # at the gate's edge (iou 0.74-0.75; 1 of 5 orbit views passed) and its axis came out 16 deg off
  # the record. --set assembly.target_source=pose6d measures it instead (checked against the record).
  target_source: kinematic
  # THE STAND-OFF (2026-10-30): 50 mm short of the trajectory's start (the task's 100 put the wrist
  # nearer the shoulder than the elbow folds, with this bench's socket and the angled grasp), and
  # the move there PLANNED by cuMotion round depth views of the socket -- the mount, the D415, the
  # gripper and the held connector (+ the first 60 mm of cable) kept off what the camera saw.
  standoff:
    distance_mm: 50.0
    plan: true
    scene: orbit                 # the socket view + an orbit about the target (pose6d.orbit); `view`: one
    # Where the plan's socket views come from: auto = the newest SAVED ones for a kinematic target
    # (the user, 2026-11-02: no look at the socket when its pose is not being estimated; the fixture
    # is assumed fixed either way), a scan otherwise. scan | saved | none (plane only) also work.
    socket_views: auto
  # THE ROLL ABOUT THE INSERTION AXIS: a BNC plug's body turns freely (the bayonet collar is what
  # clocks), so the engage roll is chosen for reach: -135 deg keeps every joint >= 12 deg inside the
  # limits less the 2 deg margin from the stand-off through the preload (dry run, the angled grasp).
  engage_clock_deg: -135.0
  visual_target:
    # THE SOCKET VIEW (2026-10-30), where the socket is estimated from (target_source visual /
    # pose6d): the camera 0.36 m from the socket (the recorded target, frames file), aimed at it,
    # 40 deg below horizontal and 15 deg round from straight -x -- far enough for the D415's depth
    # (~0.3 m minimum). Every joint at least 6 deg inside the limits less robot.fri's 2 deg margin
    # (A4 -111.7: the first suggestion's -118.2 was refused on the arm). The 6D orbit about the
    # socket reaches 4 of its 6 views; the fingertip stays 355 mm over the bench (dry run, with the
    # margin). The user's first, [15, 35, 4, -109, 30, -36, -20], had the socket 0.25 m away.
    view_joints_deg: [21.1, 19.6, 6.6, -111.7, 76.7, -37.9, -62.2]
  engage:
    contact:
      # 'ARE WE TOUCHING', from KUKA's torque-based estimate: its axial error while the arm creeps
      # is ~1-2 N (and 2-5 N over larger moves), so the UR's 1.0 N declared contact with nothing
      # touched (2026-10-30). Above the error, and held twice as long.
      force_n: 3.0
      persistence_s: 0.20

# ---- Compliance on a wrench ESTIMATED from joint torques (robot/admittance.py) -------------------
# The software admittance yields to the wrench; this arm's comes from its joint torques, and while
# it moves that estimate is off by friction that flips with each joint's direction. With the UR's
# settings the two drove each other: on 2026-10-30 the contact creep swung the connector +-3.5 mm
# across its axis at 0.8 Hz and 5 mm along it with nothing touched (the grasp's compliant moves
# up to 5 mm off their lines) -- the shaking. So, for this arm: forces under 3 N are not yielded
# to (only the excess is), and the rotations are not compliant at all -- 0.5 Nm of estimate error
# at 10 Nm/rad tilted the tool 3 deg, ~10 mm at the connector's tip. The translations still give,
# so a connector off the socket's axis is still guided in.
compliance:
  force_deadband_n: 3.0
  selected_axes: [1, 1, 1, 0, 0, 0]
